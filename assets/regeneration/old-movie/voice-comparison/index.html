<!doctype html>
<!--
  Interactive voice comparison demo.
  Usage: serve the repository over HTTP (for example `python3 -m http.server`)
  and open /assets/regeneration/old-movie/voice-comparison/ in a modern browser.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Use the audio mode controls to compare the original dialogue with reconstructed speaker tracks." />
    <title>Voice Comparison — Interactive Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --surface: #080b11;
        --text: #f7f9fc;
        --muted: #9ca6b5;
        --blue: #5385ff;
        --red: #ff4f78;
        --hairline: rgba(255, 255, 255, .13);
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        display: grid;
        align-items: start;
        justify-items: center;
        padding: clamp(14px, 2svh, 20px) clamp(14px, 4vw, 54px);
        color: var(--text);
        background:
          radial-gradient(circle at 50% 8%, rgba(31, 81, 130, .22), transparent 38%),
          var(--surface);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button { color: inherit; font: inherit; }

      .demo {
        width: min(100%, 900px, max(520px, calc(133.333svh - 433px)));
      }

      .demo-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 14px;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: #74bfff;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 3vw, 36px);
        line-height: 1.08;
        letter-spacing: -.035em;
        white-space: nowrap;
      }

      .player {
        overflow: hidden;
        background: #020307;
        border: 1px solid var(--hairline);
        border-radius: 18px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, .42);
      }

      .stage {
        position: relative;
        aspect-ratio: 4 / 3;
        isolation: isolate;
        overflow: hidden;
        background: #000;
      }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: linear-gradient(to top, rgba(0, 0, 0, .48), transparent 24%);
      }

      .mode-status {
        position: absolute;
        z-index: 3;
        left: 50%;
        bottom: 18px;
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 36px;
        padding: 8px 13px;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: rgba(7, 10, 16, .72);
        backdrop-filter: blur(14px);
        transform: translateX(-50%);
        pointer-events: none;
        white-space: nowrap;
        font-size: 12px;
      }

      .mode-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8a94a3;
        box-shadow: 0 0 0 4px rgba(138, 148, 163, .12);
      }

      .mode-status[data-mode="enhanced"] .mode-dot {
        background: #a995ff;
        box-shadow: 0 0 12px rgba(169, 149, 255, .85);
      }

      .big-play {
        position: absolute;
        z-index: 4;
        top: 50%;
        left: 50%;
        display: grid;
        place-items: center;
        width: 70px;
        height: 70px;
        padding: 0 0 0 4px;
        color: #10131a;
        background: rgba(255, 255, 255, .92);
        border: 0;
        border-radius: 50%;
        box-shadow: 0 14px 40px rgba(0, 0, 0, .35);
        transform: translate(-50%, -50%);
        cursor: pointer;
        font-size: 23px;
        transition: transform 180ms ease, opacity 180ms ease;
      }

      .big-play:hover { transform: translate(-50%, -50%) scale(1.06); }
      .big-play:disabled { cursor: wait; opacity: .72; }
      .player[data-resource-state="error"] .big-play:disabled { cursor: not-allowed; }
      .player.is-playing .big-play { opacity: 0; pointer-events: none; }

      .mode-controls {
        position: relative;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        padding: 5px;
        background: #080c13;
        border-top: 1px solid var(--hairline);
        isolation: isolate;
      }

      .mode-controls::before {
        content: "";
        position: absolute;
        z-index: 0;
        top: 5px;
        bottom: 5px;
        left: 5px;
        width: calc((100% - 14px) / 2);
        background: rgba(170, 178, 191, .14);
        border: 1px solid rgba(220, 226, 235, .72);
        border-radius: 8px;
        box-shadow: 0 0 18px rgba(170, 178, 191, .08);
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      }

      .player.is-enhanced .mode-controls::before {
        background: rgba(169, 149, 255, .16);
        border-color: #a995ff;
        box-shadow: 0 0 20px rgba(116, 126, 255, .12), 0 0 20px rgba(255, 79, 120, .08);
        transform: translateX(calc(100% + 4px));
      }

      .mode-button {
        --button-accent: #aab2bf;
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 44px;
        padding: 9px 14px;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        transition: color 150ms ease;
      }

      .mode-button[data-audio-mode="enhanced"] { --button-accent: #a995ff; }
      .mode-button::before {
        content: "";
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        background: var(--button-accent);
        border-radius: 50%;
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--button-accent) 14%, transparent);
      }

      .mode-button:hover { color: #fff; }
      .mode-button:focus-visible { outline: 2px solid var(--button-accent); outline-offset: 2px; }
      .mode-button.is-active {
        color: #fff;
      }

      .waveform-dock {
        --waveform-progress: 61px;
        position: relative;
        padding: 12px 16px 14px;
        background: rgba(10, 14, 21, .96);
        border-top: 1px solid var(--hairline);
        cursor: crosshair;
        touch-action: none;
        user-select: none;
      }

      .waveform-set {
        display: grid;
        gap: 4px;
      }

      .waveform-row {
        display: grid;
        grid-template-columns: 126px minmax(0, 1fr);
        gap: 11px;
        align-items: center;
        min-height: 32px;
        padding: 2px 5px;
        border-radius: 6px;
        opacity: .18;
        filter: saturate(.55) brightness(.72);
        transition: opacity 160ms ease, filter 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .player:not(.is-enhanced) .waveform-row.original,
      .player.is-enhanced .waveform-row.speaker0,
      .player.is-enhanced .waveform-row.speaker1 {
        opacity: 1;
        filter: saturate(1.08) brightness(1.16) drop-shadow(0 0 4px color-mix(in srgb, var(--wave-color) 38%, transparent));
        background: color-mix(in srgb, var(--wave-color) 11%, transparent);
        box-shadow: inset 3px 0 0 var(--wave-color), 0 0 14px color-mix(in srgb, var(--wave-color) 10%, transparent);
      }

      .player.is-enhanced .waveform-row.speaker0 {
        background: rgba(255, 79, 120, .14);
      }

      .player.is-enhanced .waveform-row.speaker1 {
        background: rgba(83, 133, 255, .14);
      }

      .waveform-label {
        color: var(--wave-color);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .04em;
        text-transform: uppercase;
      }

      .waveform-track-control {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 7px;
      }

      .track-mute {
        min-width: 54px;
        padding: 4px 7px;
        color: var(--wave-color);
        background: color-mix(in srgb, var(--wave-color) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--wave-color) 45%, transparent);
        border-radius: 999px;
        cursor: pointer;
        font-size: 9px;
        font-weight: 750;
        line-height: 1.2;
      }

      .track-mute:hover { background: color-mix(in srgb, var(--wave-color) 20%, transparent); }
      .track-mute:focus-visible { outline: 2px solid var(--wave-color); outline-offset: 2px; }
      .track-mute[aria-pressed="true"] { color: #080b11; background: var(--wave-color); }
      .player:not(.is-enhanced) .track-mute { pointer-events: none; opacity: .35; }

      .dock-wave {
        display: block;
        width: 100%;
        height: 30px;
        overflow: visible;
        transition: opacity 160ms ease, filter 160ms ease;
      }

      .wave-baseline {
        stroke: var(--wave-color);
        stroke-width: 1;
        opacity: .34;
        vector-effect: non-scaling-stroke;
      }

      .wave-shape {
        fill: var(--wave-color);
        opacity: .96;
      }

      .waveform-progress {
        position: absolute;
        z-index: 2;
        top: 7px;
        bottom: 7px;
        left: var(--waveform-progress);
        width: 1.5px;
        background: #ffc436;
        box-shadow: 0 0 8px rgba(255, 196, 54, .72);
        pointer-events: none;
        transform: translateX(-1px);
      }

      .waveform-row.original { --wave-color: #aab2bf; }
      .waveform-row.speaker0 { --wave-color: var(--red); }
      .waveform-row.speaker1 { --wave-color: var(--blue); }

      .player.is-enhanced .waveform-row.speaker0.is-muted .dock-wave,
      .player.is-enhanced .waveform-row.speaker1.is-muted .dock-wave {
        --wave-color: #626b78;
        opacity: .42;
        filter: saturate(.12) brightness(.62);
      }

      .audio-bank { display: none; }

      @media (max-width: 680px) {
        body { padding: 14px; }
        .demo-header { display: block; margin: 0 4px 14px; }
        h1 { white-space: normal; }
        .player { border-radius: 12px; }
        .mode-status { bottom: 10px; }
        .mode-controls { padding: 5px; gap: 4px; }
        .mode-button { min-height: 42px; padding-inline: 8px; font-size: 11px; }
        .waveform-dock { padding-inline: 12px; }
        .waveform-row { grid-template-columns: 116px minmax(0, 1fr); gap: 7px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: .01ms !important; }
      }

    </style>
  </head>
  <body>
    <main class="demo">
      <header class="demo-header">
        <div>
          <p class="eyebrow">AveraLabs Voice Pipeline</p>
          <h1>Full-Duplex Speech Data from Real Conversations</h1>
        </div>
      </header>

      <section class="player" aria-label="Interactive dialogue reconstruction demo">
        <div class="stage">
          <video preload="auto" playsinline aria-label="Two-speaker dialogue clip from His Girl Friday">
            <source src="../source.mp4" type="video/mp4" />
          </video>

          <div class="mode-status" data-mode="original" aria-live="polite">
            <span class="mode-dot"></span>
            <span class="mode-copy">Original audio</span>
          </div>
          <button class="big-play" type="button" aria-label="Play demo">▶</button>
        </div>

        <div class="mode-controls" role="group" aria-label="Audio mode">
          <button class="mode-button is-active" type="button" data-audio-mode="original" aria-pressed="true">Original</button>
          <button class="mode-button" type="button" data-audio-mode="enhanced" aria-pressed="false">Reconstructed</button>
        </div>

        <div class="waveform-dock" aria-label="Dialogue waveforms">
          <span class="waveform-progress" aria-hidden="true"></span>
          <div class="waveform-set">
            <div class="waveform-row original">
              <span class="waveform-label">Original</span>
              <svg class="dock-wave" viewBox="0 0 1000 30" preserveAspectRatio="none" aria-hidden="true">
                <line class="wave-baseline" x1="0" y1="15" x2="1000" y2="15"></line>
                <path class="wave-shape" data-wave-track="original"></path>
              </svg>
            </div>
            <div class="waveform-row speaker0">
              <span class="waveform-track-control">
                <span class="waveform-label">Speaker 0</span>
                <button class="track-mute" type="button" data-mute-track="speaker0" aria-label="Mute Speaker 0" aria-pressed="false">Mute</button>
              </span>
              <svg class="dock-wave" viewBox="0 0 1000 30" preserveAspectRatio="none" aria-hidden="true">
                <line class="wave-baseline" x1="0" y1="15" x2="1000" y2="15"></line>
                <path class="wave-shape" data-wave-track="speaker0"></path>
              </svg>
            </div>
            <div class="waveform-row speaker1">
              <span class="waveform-track-control">
                <span class="waveform-label">Speaker 1</span>
                <button class="track-mute" type="button" data-mute-track="speaker1" aria-label="Mute Speaker 1" aria-pressed="false">Mute</button>
              </span>
              <svg class="dock-wave" viewBox="0 0 1000 30" preserveAspectRatio="none" aria-hidden="true">
                <line class="wave-baseline" x1="0" y1="15" x2="1000" y2="15"></line>
                <path class="wave-shape" data-wave-track="speaker1"></path>
              </svg>
            </div>
          </div>
        </div>

        <div class="audio-bank" aria-hidden="true">
          <audio data-speaker-track="speaker0" preload="auto" src="../reconstruction-0.wav"></audio>
          <audio data-speaker-track="speaker1" preload="auto" src="../reconstruction-1.wav"></audio>
        </div>
      </section>
    </main>

    <script src="waveform-peaks.js"></script>
    <script>
      /** Keeps the visual mode, playback sources, and progress display synchronized. */
      (() => {
        /** @typedef {'original' | 'enhanced'} AudioMode */
        /** @typedef {'original' | 'speaker0' | 'speaker1'} WaveformTrack */
        /** @typedef {'speaker0' | 'speaker1'} SpeakerTrack */
        /** @typedef {'loading' | 'ready' | 'error'} ResourceState */
        /** @typedef {'automatic' | 'user'} ModeChangeSource */

        const AUTOMATIC_SWITCH_INTERVAL_MS = 3000;
        const MEDIA_SYNC_TOLERANCE_SECONDS = .12;
        const WAVEFORM_CENTER_Y = 15;
        const WAVEFORM_MAXIMUM_HEIGHT = 13;
        const WAVEFORM_VIEWBOX_WIDTH = 1000;
        const SPEAKER_TRACKS = /** @type {const} */ (['speaker0', 'speaker1']);
        const MODE_LABELS = /** @type {Record<AudioMode, string>} */ ({
          original: 'Original audio',
          enhanced: 'Reconstructed audio',
        });

        /**
         * Fails early when the page structure and controller contract drift apart.
         * @param {ParentNode} root
         * @param {string} selector
         * @returns {Element}
         */
        function requireElement(root, selector) {
          const element = root.querySelector(selector);
          if (!element) throw new Error(`Required element is missing: ${selector}`);
          return element;
        }

        const player = /** @type {HTMLElement} */ (requireElement(document, '.player'));
        const video = /** @type {HTMLVideoElement} */ (requireElement(player, 'video'));
        const playButton = /** @type {HTMLButtonElement} */ (requireElement(player, '.big-play'));
        const waveformDock = /** @type {HTMLElement} */ (requireElement(player, '.waveform-dock'));
        const referenceWaveform = /** @type {SVGSVGElement} */ (requireElement(waveformDock, '.dock-wave'));
        const status = /** @type {HTMLElement} */ (requireElement(player, '.mode-status'));
        const statusCopy = /** @type {HTMLElement} */ (requireElement(status, '.mode-copy'));
        const speakerAudios = /** @type {Record<SpeakerTrack, HTMLAudioElement>} */ ({
          speaker0: /** @type {HTMLAudioElement} */ (requireElement(player, '[data-speaker-track="speaker0"]')),
          speaker1: /** @type {HTMLAudioElement} */ (requireElement(player, '[data-speaker-track="speaker1"]')),
        });
        const speakerAudioElements = SPEAKER_TRACKS.map((track) => speakerAudios[track]);
        const muteButtons = /** @type {NodeListOf<HTMLButtonElement>} */ (player.querySelectorAll('.track-mute'));
        const speakerRows = /** @type {Record<SpeakerTrack, HTMLElement>} */ ({
          speaker0: /** @type {HTMLElement} */ (requireElement(player, '.waveform-row.speaker0')),
          speaker1: /** @type {HTMLElement} */ (requireElement(player, '.waveform-row.speaker1')),
        });
        const modeButtons = /** @type {NodeListOf<HTMLButtonElement>} */ (player.querySelectorAll('.mode-button'));
        const wheelSwitchTargets = /** @type {NodeListOf<HTMLElement>} */ (player.querySelectorAll('.stage, .mode-controls'));

        /** @type {AudioMode} */
        let activeMode = 'original';
        /** @type {ResourceState} */
        let resourceState = 'loading';
        /** @type {SpeakerTrack | null} */
        let mutedSpeakerTrack = null;
        /** @type {number | null} */
        let automaticSwitchTimer = null;
        let automaticSwitchingEnabled = true;

        const waveformPeaks = /** @type {{duration: number, original: number[], speaker0: number[], speaker1: number[]}} */ (
          window.DIALOGUE_WAVEFORM_PEAKS
        );
        if (!waveformPeaks) throw new Error('Real waveform peak data did not load.');
        const waveformTracks = /** @type {Record<WaveformTrack, number[]>} */ ({
          original: waveformPeaks.original,
          speaker0: waveformPeaks.speaker0,
          speaker1: waveformPeaks.speaker1,
        });

        /** @param {number} value @returns {number} */
        function clampRatio(value) {
          return Math.min(1, Math.max(0, value));
        }

        /**
         * Builds one closed, mirrored amplitude envelope from decoded audio peaks.
         * @param {number[]} peaks
         * @returns {string}
         */
        function buildWaveformPath(peaks) {
          const lastIndex = Math.max(1, peaks.length - 1);
          const upper = peaks.map((peak, index) => {
            const x = (index / lastIndex) * WAVEFORM_VIEWBOX_WIDTH;
            const y = WAVEFORM_CENTER_Y - peak * WAVEFORM_MAXIMUM_HEIGHT;
            return `${index === 0 ? 'M' : 'L'}${x.toFixed(2)},${y.toFixed(2)}`;
          });
          const lower = peaks.map((peak, index) => {
            const reversedIndex = peaks.length - 1 - index;
            const x = (reversedIndex / lastIndex) * WAVEFORM_VIEWBOX_WIDTH;
            const y = WAVEFORM_CENTER_Y + peaks[reversedIndex] * WAVEFORM_MAXIMUM_HEIGHT;
            return `L${x.toFixed(2)},${y.toFixed(2)}`;
          });
          return `${upper.join(' ')} ${lower.join(' ')} Z`;
        }

        /** Draws every waveform from the precomputed peak contract. */
        function renderWaveforms() {
          player.querySelectorAll('[data-wave-track]').forEach((element) => {
            const path = /** @type {SVGPathElement} */ (element);
            const track = /** @type {WaveformTrack} */ (path.dataset.waveTrack);
            const peaks = waveformTracks[track];
            if (!Array.isArray(peaks)) throw new Error(`Missing waveform track: ${track}`);
            path.setAttribute('d', buildWaveformPath(peaks));
          });
        }

        /** Synchronizes the enhanced dialogue before it becomes audible. */
        function synchronizeEnhancedAudio() {
          speakerAudioElements.forEach((audio) => {
            if (Math.abs(audio.currentTime - video.currentTime) > MEDIA_SYNC_TOLERANCE_SECONDS) audio.currentTime = video.currentTime;
          });
        }

        /** Updates speaker audibility and controls without touching playback position. */
        function renderSpeakerMuteState() {
          const isEnhanced = activeMode === 'enhanced';
          SPEAKER_TRACKS.forEach((track) => {
            speakerAudios[track].muted = !isEnhanced || mutedSpeakerTrack === track;
          });
          muteButtons.forEach((button) => {
            const track = /** @type {SpeakerTrack} */ (button.dataset.muteTrack);
            const isMuted = mutedSpeakerTrack === track;
            button.textContent = isMuted ? 'Unmute' : 'Mute';
            button.setAttribute('aria-label', `${isMuted ? 'Unmute' : 'Mute'} ${track === 'speaker0' ? 'Speaker 0' : 'Speaker 1'}`);
            button.setAttribute('aria-pressed', String(isMuted));
            button.setAttribute('aria-disabled', String(!isEnhanced));
            speakerRows[track].classList.toggle('is-muted', isMuted);
          });
        }

        /** Reflects preload readiness without overwriting the selected audio mode. */
        function renderResourceState() {
          const isReady = resourceState === 'ready';
          player.dataset.resourceState = resourceState;
          playButton.disabled = !isReady;
          playButton.textContent = resourceState === 'loading' ? '…' : '▶';
          playButton.setAttribute('aria-label', resourceState === 'loading'
            ? 'Loading demo media'
            : resourceState === 'error' ? 'Demo media failed to load' : 'Play demo');
          statusCopy.textContent = resourceState === 'loading'
            ? 'Loading media…'
            : resourceState === 'error' ? 'Media failed to load' : MODE_LABELS[activeMode];
        }

        /** Applies the current mode to status, controls, waveforms, and audible sources. */
        function renderMode() {
          const isEnhanced = activeMode === 'enhanced';
          status.dataset.mode = activeMode;
          player.classList.toggle('is-enhanced', isEnhanced);
          modeButtons.forEach((button) => {
            const isActive = button.dataset.audioMode === activeMode;
            button.classList.toggle('is-active', isActive);
            button.setAttribute('aria-pressed', String(isActive));
          });
          synchronizeEnhancedAudio();
          video.muted = isEnhanced;
          renderSpeakerMuteState();
          renderResourceState();
          requestAnimationFrame(updateProgress);
        }

        /**
         * Resolves once a required media element has enough buffered data to start.
         * @param {HTMLMediaElement} media
         * @returns {Promise<void>}
         */
        function waitUntilPlayable(media) {
          if (media.error) return Promise.reject(media.error);
          if (media.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) return Promise.resolve();
          return new Promise((resolve, reject) => {
            const cleanup = () => {
              media.removeEventListener('canplay', handleCanPlay);
              media.removeEventListener('error', handleError);
            };
            const handleCanPlay = () => { cleanup(); resolve(); };
            const handleError = () => { cleanup(); reject(media.error || new Error('Media preload failed.')); };
            media.addEventListener('canplay', handleCanPlay, { once: true });
            media.addEventListener('error', handleError, { once: true });
          });
        }

        /** Preloads every source needed for seamless original/reconstructed switching. */
        async function preloadMedia() {
          const requiredMedia = [video, ...speakerAudioElements];
          requiredMedia.forEach((media) => media.load());
          const readiness = requiredMedia.map(waitUntilPlayable);
          try {
            await Promise.all(readiness);
            resourceState = 'ready';
            renderResourceState();
          } catch (error) {
            resourceState = 'error';
            renderResourceState();
            console.error('Required demo media could not be preloaded.', error);
          }
        }

        /**
         * Toggles one speaker while enforcing the two-speaker contract: zero or one muted track.
         * @param {SpeakerTrack} track
         */
        function toggleSpeakerMute(track) {
          mutedSpeakerTrack = mutedSpeakerTrack === track ? null : track;
          renderSpeakerMuteState();
        }

        /** Clears the active interval while preserving whether automatic switching is enabled. */
        function clearAutomaticSwitchTimer() {
          if (automaticSwitchTimer === null) return;
          window.clearInterval(automaticSwitchTimer);
          automaticSwitchTimer = null;
        }

        /** Permanently stops the passive comparison guide after explicit user input or completion. */
        function stopAutomaticSwitching() {
          automaticSwitchingEnabled = false;
          clearAutomaticSwitchTimer();
        }

        /**
         * Changes mode through one state transition path for automatic and user input.
         * @param {AudioMode} mode
         * @param {ModeChangeSource} source
         * @returns {boolean}
         */
        function setMode(mode, source) {
          if (mode === activeMode) return false;
          if (source === 'user') stopAutomaticSwitching();
          activeMode = mode;
          renderMode();
          return true;
        }

        /** Alternates modes until playback ends or a user changes the mode. */
        function startAutomaticSwitching() {
          if (!automaticSwitchingEnabled || automaticSwitchTimer !== null || video.paused) return;
          automaticSwitchTimer = window.setInterval(() => {
            const nextMode = activeMode === 'original' ? 'enhanced' : 'original';
            setMode(nextMode, 'automatic');
          }, AUTOMATIC_SWITCH_INTERVAL_MS);
        }

        /** Starts the video and both speaker sources so mode changes remain immediate. */
        async function playMedia() {
          if (resourceState !== 'ready') return;
          synchronizeEnhancedAudio();
          renderMode();
          try {
            await Promise.all([video.play(), ...speakerAudioElements.map((audio) => audio.play())]);
          } catch (error) {
            console.error('Media playback could not start.', error);
          }
        }

        /** Pauses the video and both reconstructed speaker sources. */
        function pauseMedia() {
          video.pause();
          speakerAudioElements.forEach((audio) => audio.pause());
        }

        /** Toggles all synchronized sources through the video playback state. */
        function togglePlayback() {
          if (resourceState !== 'ready') return;
          if (video.paused) void playMedia();
          else pauseMedia();
        }

        /** Keeps the playhead aligned to the plotted area rather than its label column. */
        function updateWaveformProgress(ratio) {
          const dockBounds = waveformDock.getBoundingClientRect();
          const waveBounds = referenceWaveform.getBoundingClientRect();
          const left = waveBounds.left - dockBounds.left + clampRatio(ratio) * waveBounds.width;
          waveformDock.style.setProperty('--waveform-progress', `${left.toFixed(2)}px`);
        }

        /** Updates the visual playhead and corrects meaningful media drift. */
        function updateProgress() {
          const duration = Number.isFinite(video.duration) ? video.duration : 0;
          updateWaveformProgress(duration > 0 ? video.currentTime / duration : 0);
          synchronizeEnhancedAudio();
        }

        /**
         * Seeks both sources from the shared waveform coordinate system.
         * @param {PointerEvent} event
         */
        function seekFromWaveform(event) {
          if (!Number.isFinite(video.duration)) return;
          const bounds = referenceWaveform.getBoundingClientRect();
          const ratio = clampRatio((event.clientX - bounds.left) / bounds.width);
          const targetTime = ratio * video.duration;
          video.currentTime = targetTime;
          speakerAudioElements.forEach((audio) => { audio.currentTime = targetTime; });
          updateProgress();
        }

        /**
         * Maps upward/leftward wheel intent to Reconstructed and the opposite intent to Original.
         * @param {WheelEvent} event
         */
        function switchModeFromWheel(event) {
          const dominantDelta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
          if (dominantDelta === 0) return;
          event.preventDefault();
          setMode(dominantDelta > 0 ? 'original' : 'enhanced', 'user');
        }

        /** Connects playback, seeking, and lifecycle events. */
        function bindMediaEvents() {
          playButton.addEventListener('click', togglePlayback);
          video.addEventListener('click', togglePlayback);
          video.addEventListener('loadedmetadata', updateProgress);
          video.addEventListener('timeupdate', updateProgress);
          video.addEventListener('seeked', () => {
            speakerAudioElements.forEach((audio) => { audio.currentTime = video.currentTime; });
            renderMode();
          });
          video.addEventListener('play', () => {
            player.classList.add('is-playing');
            startAutomaticSwitching();
          });
          video.addEventListener('pause', () => {
            player.classList.remove('is-playing');
            clearAutomaticSwitchTimer();
            speakerAudioElements.forEach((audio) => audio.pause());
          });
          video.addEventListener('ended', () => {
            stopAutomaticSwitching();
            video.currentTime = 0;
            speakerAudioElements.forEach((audio) => { audio.currentTime = 0; });
            updateProgress();
          });
          waveformDock.addEventListener('pointerdown', (event) => {
            if (event.target instanceof Element && event.target.closest('.track-mute')) return;
            waveformDock.setPointerCapture(event.pointerId);
            seekFromWaveform(event);
          });
          waveformDock.addEventListener('pointermove', (event) => {
            if (event.buttons === 1 && waveformDock.hasPointerCapture(event.pointerId)) seekFromWaveform(event);
          });
        }

        /** Connects hover, activation, and wheel intent to the shared mode transition. */
        function bindModeEvents() {
          wheelSwitchTargets.forEach((target) => {
            target.addEventListener('wheel', switchModeFromWheel, { passive: false });
          });
          modeButtons.forEach((button) => {
            const mode = /** @type {AudioMode} */ (button.dataset.audioMode);
            button.addEventListener('pointerenter', (event) => {
              if (event.pointerType === 'mouse') setMode(mode, 'user');
            });
            button.addEventListener('click', () => setMode(mode, 'user'));
          });
          muteButtons.forEach((button) => {
            const track = /** @type {SpeakerTrack} */ (button.dataset.muteTrack);
            button.addEventListener('pointerdown', (event) => event.stopPropagation());
            button.addEventListener('click', (event) => {
              event.stopPropagation();
              if (activeMode !== 'enhanced') return;
              toggleSpeakerMute(track);
            });
          });
        }

        renderWaveforms();
        bindMediaEvents();
        bindModeEvents();
        renderMode();
        void preloadMedia();
      })();
    </script>
  </body>
</html>
